services:

  simulator-b:
    build: ./eeg_acquisition
    restart: unless-stopped
    environment:
      ACQ_PORT: 13854
      PACKET_INTERVAL: 1.0
    command: python simulator.py
    ports:
      - "127.0.0.1:13854:13854"
    profiles: ['sim-dual']
    
  acquisition-b:
    build: ./eeg_acquisition
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PLAYER_ID: 2
      ACQ_PORT: 13854
      # IP do PC central no cabo (NEU-138): o broker nao responde pelo Wi-Fi do evento.
      BROKER_URL: http://${CENTRAL_IP:-192.168.50.1}:3000
      POOR_SIGNAL_LEVEL_THRESHOLD: 0
      # EEG_HOST: simulator-b
      EEG_HOST: host.docker.internal
      SOURCE: real
    command: python acquisition_service.py
    # Sem depends_on: no perfil collector o acquisition-b fala com EEG/broker externos
    # (host.docker.internal / IP remoto), nao com servicos deste compose.
    profiles: ['sim-dual', 'live']
